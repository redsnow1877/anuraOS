name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/virtual-proxy-browser-ui-y75fvi]
  workflow_dispatch:

# Only one deploy at a time; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Same toolchain the CI build uses. The Rust nightly needed for v86's
      # wasm comes from rust-toolchain.toml via the runner's rustup.
      - name: Install build dependencies
        run: sudo apt update && sudo apt install -y git build-essential clang default-jre

      # `static-nov86` skips compiling the v86 emulator to wasm. Pages can't
      # host the Alpine rootfs the x86 subsystem needs (that's `make full`), so
      # the emulator could never boot here regardless — and its build currently
      # fails against floating Rust nightlies.
      - name: Pack the static site
        run: make static-nov86

      # Reports where the site is actually served, which beats guessing from
      # the repository name — a custom domain or a user/org site lives at the
      # origin root. It cannot *create* the Pages site: that needs repo admin,
      # and GITHUB_TOKEN only ever gets `pages: write`, which is deploy-only.
      # So when Pages hasn't been enabled yet this step fails; let the build
      # finish anyway and fall back to the repo name, so the artifact is still
      # produced and only the deploy job reports the missing setting.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      # A project site is served from /<repo>/, not the origin root, so the
      # build's absolute URLs need re-basing. An empty base means the origin
      # root, and the script treats that as a no-op.
      - name: Rewrite absolute paths for the Pages sub-path
        run: |
          BASE='${{ steps.pages.outputs.base_path }}'
          if [ -z "$BASE" ] && \
             [ '${{ github.event.repository.name }}' != '${{ github.repository_owner }}.github.io' ]; then
            BASE='/${{ github.event.repository.name }}'
            echo "Pages config unavailable; falling back to repo name: $BASE"
          fi
          node .github/scripts/set-base-path.mjs static "$BASE"

      # Without this, Pages runs the output through Jekyll and drops any
      # file or directory whose name starts with an underscore.
      - name: Disable Jekyll processing
        run: touch static/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
