<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="description" content="Chrome in your browser.">
  <script src="helpers.js"></script>
  <!-- ******** CSS ******** -->
  <link href="roboto.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="bookmarks.css" rel="stylesheet" type="text/css" />
  <link href="chrome-tabs/css/chrome-tabs.css" rel="stylesheet" />
  <link href="chrome-tabs/css/chrome-tabs-dark-theme.css" rel="stylesheet" />
  <link href="material-symbols-outlined.css" rel="stylesheet" />
  <link href="qol.css" rel="stylesheet" />
  <!-- ******** JS ******** -->
  <script src="/libs/draggabilly.min.js"></script>
  <script src="/libs/filer.min.js"></script>
  <script src="/libs/jszip.min.js"></script>
  <script src="/libs/createhash-browser.min.js"></script>
  <script src="/libs/pbf.min.js"></script>
  <script src="/chrome-tabs/js/chrome-tabs.js"></script>
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="proxyHelpers.js"></script>
  <script src="bookmarks.js"></script>
  <script src="elementmap.js"></script>
  <script src="settings.js"></script>
  <script src="history.js"></script>
  <script src="tab.js"></script>
  <script src="google_color_palette.js"></script>
  <script src="theme.js"></script>
  <script src="plugin.js"></script>
  <script src="extensions/injector/abstract.js"></script>
  <script src="extensions/injector/dummy.js"></script>
  <script src="extensions/injector/v2.js"></script>
  <script src="extensions/injector/v3.js"></script>
  <script src="extensions/crx3_protobuf.js"></script>
  <script src="extensions/resources.js"></script>
  <script src="extensions/extension.js"></script>
  <script src="extensions/controller.js"></script>
  <script src="connection.js"></script>
  <script src="omnibox.js"></script>
  <script src="findbar.js"></script>
  <script src="siteinfo.js"></script>
  <script src="tabmenu.js"></script>
  <script src="shortcuts.js"></script>
  <script src="browser.js"></script>
  <script src="browser-api.js"></script>
</head>

<body onload="init(document.body);">
  <div class="aboutbrowser-event-el" id="aboutbrowser-event-el"></div>
  <div class="container browserContainer" style="visibility: hidden;">
    <div class="browserControlsContainer">
      <div class="chrome-tabs chrome-tabs-dark-theme" style="--tab-content-margin: 9px">
        <div class="chrome-tabs-content-wrapper">
          <button id="addtab" class="chrome-tabs-btn" data-add-tab style="position:absolute;">
            <span class="material-symbols-outlined">add</span>
          </button>
          <div class="chrome-tabs-content">
          </div>
          <div class="chrome-tabs-content-after"></div>
        </div>
        <div class="chrome-tabs-bottom-bar"></div>
        <div class="chrome-tabs-bottom-bar chrome-tabs-second-bottom-bar"></div>
        <!-- Styles to prevent flash after JS initialization -->
        <style>
          .chrome-tabs .chrome-tab {
            width: 258px
          }

          .chrome-tabs .chrome-tab:nth-child(1) {
            transform: translate3d(0px, 0, 0)
          }

          .chrome-tabs .chrome-tab:nth-child(2) {
            transform: translate3d(239px, 0, 0)
          }
        </style>
      </div>
      <div class="navbar">
        <button class="navbarBtn" id="browserBack" onclick="window.aboutbrowser.handleBack()">
          <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <button class="navbarBtn" id="browserForward" onclick="window.aboutbrowser.handleForward()">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <button class="navbarBtn" id="browserReload" title="Reload (Ctrl+R)" onclick="window.aboutbrowser.handleReload();">
          <span class="material-symbols-outlined reloadIcon">refresh</span>
          <span class="material-symbols-outlined stopIcon">close</span>
        </button>
        <div class="omnibox" id="omnibox">
          <button class="siteChip" id="siteChip" title="View site information">
            <span class="material-symbols-outlined siteChipIcon">search</span>
            <span class="connDot" data-state="unknown"></span>
          </button>
          <input class="navbarUrl" id="browserUrl" autocomplete="off" spellcheck="false" aria-label="Browser URL" placeholder="Search or type a URL"></input>
          <button class="zoomBadge" id="zoomBadge" title="Reset zoom" hidden></button>
          <button class="bookmarksBtn" id="browserBookmarks" title="Bookmark this page (Ctrl+D)" onclick="window.aboutbrowser.handleBookmarks();">
            <span class="material-symbols-outlined">star</span>
          </button>
          <div class="omniDrop" id="omniDrop" role="listbox"></div>
        </div>
        <button class="navbarBtn" id="browserExtensions" onclick="window.aboutbrowser.handleExtensions();">
          <span class="material-symbols-outlined">extension</span>
        </button>
        <button class="navbarBtn" id="browserSettings" onclick="window.aboutbrowser.handleSettings();">
          <span class="material-symbols-outlined">more_vert</span>
        </button>
      </div>
      <div>
        <div class="moreMenu hidden">
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('newTab');">
              <span class="material-symbols-outlined menuIcon">tab</span><span class="title">New tab</span><kbd>Alt+T</kbd>
          </button>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('reopenTab');" class="reopenItem">
              <span class="material-symbols-outlined menuIcon">tab_recent</span><span class="title">Reopen closed tab</span><kbd>Alt+Shift+T</kbd>
          </button>
          <div class="sep"></div>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('find');">
              <span class="material-symbols-outlined menuIcon">search</span><span class="title">Find in page</span><kbd>Ctrl+F</kbd>
          </button>
          <div class="menuZoom">
              <span class="material-symbols-outlined menuIcon">zoom_in</span><span class="title">Zoom</span>
              <button class="zoomStep" data-zoom="-1" title="Zoom out (Ctrl+−)"><span class="material-symbols-outlined">remove</span></button>
              <span class="zoomValue">100%</span>
              <button class="zoomStep" data-zoom="1" title="Zoom in (Ctrl+=)"><span class="material-symbols-outlined">add</span></button>
          </div>
          <div class="sep"></div>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('history');">
            <span class="material-symbols-outlined menuIcon">history</span><span class="title">History</span>
          </button>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('downloads');">
            <span class="material-symbols-outlined menuIcon">download</span><span class="title">Downloads</span>
          </button>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('bookmarks');">
            <span class="material-symbols-outlined menuIcon">bookmark</span><span class="title">Bookmarks</span>
          </button>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('settings');">
            <span class="material-symbols-outlined menuIcon">settings</span><span class="title">Settings</span>
          </button>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('connection');">
            <span class="material-symbols-outlined menuIcon">hub</span><span class="title">Proxy server</span>
          </button>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('devtools');">
            <span class="material-symbols-outlined menuIcon">code</span><span class="title">Developer Tools</span>
          </button>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('shortcuts');">
            <span class="material-symbols-outlined menuIcon">keyboard</span><span class="title">Keyboard shortcuts</span>
          </button>
          <div class="sep"></div>
          <button onclick="window.aboutbrowser.handleSettingsCtxMenu('about');">
            <span class="menuIcon"><span class="placeholder"></span></span><span class="title">About ${name}</span>
          </button>
        </div>
      </div>
      <div class="bookmarksContainer"></div>
      <div class="loadBar" id="loadBar"></div>
      <div class="siteInfo" id="siteInfo" hidden></div>
      <div class="findBar" id="findBar" hidden>
      <input class="findInput" id="findInput" spellcheck="false" autocomplete="off" placeholder="Find in page" aria-label="Find in page">
      <span class="findCount" id="findCount"></span>
      <span class="findSep"></span>
      <button class="findBtn" id="findPrev" title="Previous (Shift+Enter)"><span class="material-symbols-outlined">keyboard_arrow_up</span></button>
      <button class="findBtn" id="findNext" title="Next (Enter)"><span class="material-symbols-outlined">keyboard_arrow_down</span></button>
      <button class="findBtn" id="findClose" title="Close (Esc)"><span class="material-symbols-outlined">close</span></button>
      </div>
    </div>
    <div class="tabMenu hidden" id="tabMenu"></div>
    <div class="shortcutSheet" id="shortcutSheet" hidden></div>
    <div id="popupHolder">
      <!--
      <div class="popup alert">
        <div class="title">This page says</div>
        <div class="content"></div>
        <div class="buttons"><button class="preferred">OK</button></div>
      </div>-->
      <!--<div class="popup prompt">
        <div class="title">This page says</div>
        <div class="content"></div>
        <input type="text"></input>
        <div class="buttons"><button class="preferred">OK</button></div>
      </div>-->
      <!--<div class="popup confirm">
        <div class="title">This page says</div>
        <div class="content"></div>
        <div class="buttons"><button>Cancel</button><button class="preferred">OK</button></div>
      </div>-->
    </div>
    <div id="tabContents" class="browser"></div>
    <div class="ctxMenuClickChecker" style="display:none;"></div>
  </div>
  <div class="goodbyeContainer" style="display:none;">
    <h1>Goodbye!</h1>
  </div>
</body>

</html>
