<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>New Tab</title>
    <link href="ui.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="robot.css" />
    <link href="/roboto.css" rel="stylesheet" type=text/css />
    <link rel="stylesheet" href="/material-symbols-outlined.css" />
    <link rel="stylesheet" href="start.css" />
</head>

<body>
    <div class="container">
        <div id="proxyBanner" class="proxyBanner" hidden>
            <span class="material-symbols-outlined bannerIcon">cloud_off</span>
            <div class="bannerText">
                <strong>Can't reach the proxy server</strong>
                <span>Websites won't load until the browser can reach one. It's set to <code class="bannerUrl"></code></span>
            </div>
            <button id="proxyBannerBtn" class="bannerBtn">Choose a server</button>
        </div>
        <div id="content">
            <h1>${name}</h1>
            <input type="text" class="omnibox" autocomplete="off" placeholder="Search or type a URL" id="omnibox">
            <div id="recentsWrapper"><div id="recents"></div></div>
        </div>
        <div class="footerRight">
            <div></div>
                <span>${name} ${version} more mirrors at <a href="javascript:parent.aboutbrowser.navigateTo('discord.gg/unblock')">Mirrors by Titanium Network</a></span>
            <button class="themedBtn" id="browserBack" onclick="openVerHistory();">
                <span class="material-symbols-outlined">history</span>
            </button>
        </div>
    </div>
    <script src="/browser-api-tab.js"></script>
    <script src="branding.js"></script>
    <script src="start.js"></script>
</body>

</html>
