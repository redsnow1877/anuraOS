<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.45" stop-color="#2a1a4e"/>
      <stop offset="0.78" stop-color="#7a2f5e"/>
      <stop offset="1" stop-color="#f0764a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.86" r="0.42">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.1" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#5a7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
