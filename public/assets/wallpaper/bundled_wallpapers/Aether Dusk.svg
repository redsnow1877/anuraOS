  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#haze)"/>
  <rect width="2560" height="1440" fill="url(#sun)"/>
  <rect width="2560" height="1440" filter="url(#grain2)" opacity="0.05"/>
</svg>
